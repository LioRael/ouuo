    - heading "Mechanical Keyboard" [level=1] [ref=e4]
    - paragraph [ref=e5]: Type, click or tap the keys. Drag with a mouse to play across keys. Swipe horizontally to reach every key on a small screen. Tab to enter, arrows to move, Enter or Space to press. The orange dial toggles the backlight. Roll the right-side wheel up or down to change the viewing angle, or focus it and use the arrow keys, Home and End. The left-side switch turns key sound on and off.
